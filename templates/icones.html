{# Ícones do site em SVG (desenhos simples que pegam a cor do CSS) #}
{% macro icone(nome) %}
<svg class="svg-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if nome == 'usuario' %}<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>
{% elif nome == 'calendario' %}<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>
{% elif nome == 'dente' %}<path d="M7 3C4.5 3 3 5 3 7.5c0 2 .8 3.3 1.3 5 .6 2.2.9 8.5 3.2 8.5 1.6 0 1.6-3 2-4.6.3-1.2.9-2.4 2.5-2.4s2.2 1.2 2.5 2.4c.4 1.6.4 4.6 2 4.6 2.3 0 2.6-6.3 3.2-8.5.5-1.7 1.3-3 1.3-5C21 5 19.5 3 17 3c-2 0-3 1-5 1S9 3 7 3z"/>
{% elif nome == 'local' %}<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>
{% elif nome == 'busca' %}<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>
{% elif nome == 'brilho' %}<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16v4M17 18h4"/>
{% elif nome == 'cruz' %}<path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/>
{% elif nome == 'extracao' %}<path d="M12 21V9M7 14l5-5 5 5M5 3h14"/>
{% elif nome == 'sol' %}<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
{% elif nome == 'telefone' %}<path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/>
{% elif nome == 'mensagem' %}<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>
{% elif nome == 'email' %}<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>
{% endif %}
</svg>
{% endmacro %}
